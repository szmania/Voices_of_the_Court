  <script>require("../../dist/shared/LocalizationManager.js")</script>
  <script>
    const { LocalizationManager } = require("../../dist/shared/LocalizationManager.js");
    window.LocalizationManager = LocalizationManager;
  </script>
  <script>require("../../dist/configWindow/components/LanguageSelector.js")</script>
  <script>require("../../dist/configWindow/components/configCheckbox.js")</script>
  <script>require("../../dist/configWindow/components/ConfigText.js")</script>
  <script>require("../../dist/configWindow/components/ConfigNumber.js")</script>
  <script>require("../../dist/configWindow/components/ConfigSlider.js")</script>
    <script>require("../../dist/configWindow/components/ParametersBox.js")</script>
  <script>require("../../dist/configWindow/components/tooltip.js")</script>

  <script>
    // Initialize localization for settings page
    async function initLocalization() {
      const { ipcRenderer } = require('electron');
      const config = await ipcRenderer.invoke('get-config');
      // @ts-ignore
      if (window.LocalizationManager) {
        // @ts-ignore
        await window.LocalizationManager.loadTranslations(config.language || 'en');
        // @ts-ignore
        window.LocalizationManager.applyTranslations();
      }
    }
    initLocalization();

    // Add event listeners
    document.addEventListener('DOMContentLoaded', function() {
      const { ipcRenderer } = require('electron');

      const openReadmeBtn = document.getElementById('open-readme');
      if (openReadmeBtn) {
        openReadmeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          ipcRenderer.send('open-readme-window');
        });
      }

      const manualCompactionBtn = document.getElementById('manual-compaction-trigger');
      if (manualCompactionBtn) {
        manualCompactionBtn.addEventListener('click', function(e) {
          e.preventDefault();
          ipcRenderer.send('manual-compaction-trigger');
        });
      }

      const exportBtn = document.getElementById('export-player-data');
      if (exportBtn) {
        exportBtn.addEventListener('click', async function(e) {
          e.preventDefault();
          const result = await ipcRenderer.invoke('export-player-data');
          if (result.success) {
            console.log('Player data exported to:', result.filePath);
          } else {
            console.error('Export failed:', result.error);
          }
        });
      }

      const importBtn = document.getElementById('import-player-data');
      if (importBtn) {
        importBtn.addEventListener('click', async function(e) {
          e.preventDefault();
          const result = await ipcRenderer.invoke('import-player-data');
          if (result.success) {
            console.log('Player data imported from:', result.filePath);
          } else {
            console.error('Import failed:', result.error);
          }
        });
      }

      // --- Compaction Progress Polling ---
      let statusPollInterval = null;
      let compactionInProgress = false;

      async function updateCompactionStatus() {
        try {
          const status = await ipcRenderer.invoke('get-compaction-status');
          const progressBar = document.getElementById('compaction-progress-bar');
          const phase1Line = document.getElementById('compaction-phase1-line');
          const usageText = document.getElementById('compaction-context-usage-text');
          const statusDisplay = document.getElementById('compaction-status-display');
          const lastResult = document.getElementById('compaction-last-result');
          const phase1Count = document.getElementById('compaction-phase1-count');

          if (progressBar) {
            const pct = Math.min(status.contextUsagePct, 100);
            progressBar.style.width = pct + '%';
            progressBar.className = 'compaction-progress-bar';
            if (pct >= status.phase1ThresholdPct) {
              progressBar.classList.add('danger');
            } else if (pct >= status.phase1ThresholdPct * 0.85) {
              progressBar.classList.add('warning');
            }
          }
          if (phase1Line) {
            phase1Line.style.left = status.phase1ThresholdPct + '%';
          }
          const phase1Label = document.getElementById('compaction-phase1-label');
          if (phase1Label) {
            phase1Label.style.left = status.phase1ThresholdPct + '%';
            const thresholdText = window.LocalizationManager ? window.LocalizationManager.getTranslation('settings.phase1_threshold_label', 'Threshold') : 'Threshold';
            phase1Label.textContent = `${thresholdText} (${status.phase1ThresholdPct}%)`;
          }
          if (usageText) {
            usageText.textContent = status.tokenCount + ' / ' + status.contextSize + ' tokens (' + status.contextUsagePct + '%)';
          }
          if (statusDisplay) {
            if (status.isCompacting) {
              statusDisplay.textContent = 'Compacting...';
              statusDisplay.style.color = '#3498db';
            } else if (!status.enableCompaction) {
              statusDisplay.textContent = 'Disabled';
              statusDisplay.style.color = '#888';
            } else if (status.cooldownRemaining > 0) {
              const secs = Math.ceil(status.cooldownRemaining / 1000);
              statusDisplay.textContent = 'Cooldown (' + secs + 's remaining)';
              statusDisplay.style.color = '#ffab00';
            } else {
              statusDisplay.textContent = 'Idle';
              statusDisplay.style.color = '#4caf50';
            }
          }
          if (phase1Count) {
            phase1Count.textContent = 'Phase 1 Summaries: ' + status.phase1SummaryCount + ' / ' + status.phase2Threshold;
          }
          if (lastResult) {
            lastResult.textContent = '';
          }
        } catch (err) {
          // Silently ignore - conversation may not be active yet
        }
      }

      // Listen for compaction status updates from manual trigger
      ipcRenderer.on('compaction-status-update', (event, result) => {
        compactionInProgress = false;
        const statusDisplay = document.getElementById('compaction-status-display');
        const lastResult = document.getElementById('compaction-last-result');
        if (statusDisplay) {
          if (result.error) {
            statusDisplay.textContent = 'Error';
            statusDisplay.style.color = '#f44336';
          } else {
            statusDisplay.textContent = 'Completed';
            statusDisplay.style.color = '#4caf50';
            setTimeout(() => { updateCompactionStatus(); }, 2000);
          }
        }
        if (lastResult) {
          if (result.error) {
            lastResult.textContent = 'Failed: ' + result.error;
            lastResult.style.color = '#f44336';
          } else {
            lastResult.textContent = 'Last: Phase1=' + (result.phase1Run ? 'Yes' : 'No') + ', Phase2=' + (result.phase2Run ? 'Yes' : 'No') + ', Memories=' + result.memoriesCreated;
            lastResult.style.color = '#aaa';
          }
        }
      });

      // Start polling when page is visible, stop when hidden
      function startCompactionPolling() {
        updateCompactionStatus();
        statusPollInterval = setInterval(updateCompactionStatus, 3000);
      }
      function stopCompactionPolling() {
        if (statusPollInterval) {
          clearInterval(statusPollInterval);
          statusPollInterval = null;
        }
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopCompactionPolling();
        } else {
          startCompactionPolling();
        }
      });
      startCompactionPolling();
    });
  </script>
