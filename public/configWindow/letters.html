<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title data-i18n="app.title">Voices of the Court 2.0 - Community Edition</title>
    <link rel="stylesheet" href="config.css" />
    <link rel="stylesheet" href="../chatWindow/theme.css" />
    <style>
        mark {
            background-color: yellow;
            color: black;
        }
        .current-match {
            background-color: orange;
            border: 1px solid black;
        }
        .refresh-status {
            display: inline-flex;
            align-items: center;
            margin-left: 10px;
            font-family: 'Gitan', sans-serif;
            color: #a18c61;
        }
        #letter-refresh-btn.refreshing {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        .letter-item-actions {
            font-size: 0.8em;
            color: #a18c61;
            margin-top: 5px;
            padding-left: 10px;
            border-left: 2px solid #3d2e1e;
        }
        .letter-item-actions ul {
            list-style-type: square;
            padding-left: 15px;
            margin: 5px 0 0 0;
        }
        .letter-item-actions li {
            padding: 0;
            border: none;
            cursor: default;
        }
        .letter-item-actions li:hover {
            background-color: transparent;
            color: inherit;
        }
        .triggered-actions-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #5a4a35;
        }
        .triggered-actions-section h4 {
            margin-top: 0;
            color: #cca43b;
            font-family: 'Paradox', serif;
        }
        .triggered-actions-list {
            list-style-type: square;
            padding-left: 20px;
            color: #dcdcd2;
        }
        .no-actions-text {
            color: #a18c61;
            font-style: italic;
        }
        .action-approval-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-prompt {
            background-color: rgba(25, 25, 25, 0.7);
            border: 1px solid #5a4a35;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            color: white;
            border: solid 2px rgb(39, 33, 0);
            font-size: 0.9rem;
            background-image: url("../assets/button.png");
            background-size: cover;
            font-family: 'Gitan', sans-serif;
            cursor: url("../assets/cursor.png"), auto;
            transition: all 0.2s;
            padding: 6px 12px;
            border-radius: 2px;
        }

        .action-buttons button:hover {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(204, 164, 59, 0.2);
        }

        .action-approve-button {
            background-color: #2E7D32;
        }
        .action-approve-button:hover {
            background-color: #388E3C;
        }

        .action-decline-button {
            background-color: #A94442;
        }
        .action-decline-button:hover {
            background-color: #C95452;
        }
    </style>
</head>
<body>
<div class="navbar">
    <ul>
        <li><a href="connection.html" data-i18n="nav.connection">Connection</a></li>
        <li><a href="actions.html" data-i18n="nav.actions">Actions</a></li>
        <li><a href="summarization.html" data-i18n="nav.summarization">Summarization</a></li>
        <li><a href="prompts.html" data-i18n="nav.prompts">Prompts</a></li>
        <li class="active"><a href="letters.html" data-i18n="nav.letters">Letters</a></li>
        <li><a href="diaries.html" data-i18n="nav.diaries">Diaries</a></li>
        <li><a href="settings.html" data-i18n="nav.settings">Settings</a></li>
        <li><a href="system.html" data-i18n="nav.system">System</a></li>
        <li class="help-menu"><a href="#" id="open-readme" data-i18n="nav.help">Help</a></li>
        <language-selector></language-selector>
    </ul>
</div>

<div class="container" id="container" style="display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;">
    <div id="letter-loader" class="loader" style="display: none;"></div>
    <div id="letter-controls">
        <div class="control-group">
            <button id="letter-refresh-btn" class="btn" data-i18n="letters.refresh">Refresh</button>
            <div id="refresh-status" class="refresh-status">
                <span id="refresh-countdown"></span>
            </div>
        </div>
        <div class="control-group">
            <label for="player-select" data-i18n="letters.player">Player:</label>
            <select id="player-select"></select>
        </div>
        <div class="control-group">
            <label for="character-select" data-i18n="letters.character">Character:</label>
            <select id="character-select"></select>
        </div>
        <div class="control-group">
            <label for="letter-sort-select" data-i18n="letters.sort_by">Sort by:</label>
            <select id="letter-sort-select">
                <option value="gameDate" data-i18n="letters.sort_game_date">Game Date</option>
                <option value="realDate" data-i18n="letters.sort_real_date" selected>Real Date</option>
            </select>
        </div>
        <div class="control-group">
            <label for="letter-search-input" data-i18n="letters.search">Search:</label>
            <input type="search" id="letter-search-input" data-i18n-placeholder="letters.search_placeholder" placeholder="Search letters...">
        </div>
        <div class="control-group">
            <button id="toggle-future-btn" class="btn" data-i18n="letters.hide_future">Hide Future Letters</button>
        </div>
        <div id="letter-thread-status-container" class="control-group">
            <!-- Status will be injected here -->
        </div>
    </div>
    <div id="letter-status-summary">
        <!-- Status summary will be injected here -->
    </div>
    <div class="letter-main-content">
        <div id="letter-list-container">
            <ul id="letter-list">
                <!-- Letter items will be dynamically inserted here -->
            </ul>
        </div>
        <div id="letter-view-container">
            <p data-i18n="letters.select">Select a letter to read.</p>
        </div>
    </div>
    <div id="letter-status-message" class="status-message"></div>
</div>

<script>require("../../dist/shared/LocalizationManager.js")</script>
<script>
  const { LocalizationManager } = require("../../dist/shared/LocalizationManager.js");
  window.LocalizationManager = LocalizationManager;
</script>
<script>require("../../dist/configWindow/components/LanguageSelector.js")</script>
<script>require("../../dist/configWindow/letterRenderer.js")</script>
<script>
  // 添加帮助菜单点击事件
  document.addEventListener('DOMContentLoaded', function() {
    const openReadmeBtn = document.getElementById('open-readme');
    if (openReadmeBtn) {
      openReadmeBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const { ipcRenderer } = require('electron');
        ipcRenderer.send('open-readme-window');
      });
    }
  });
</script>
</body>
</html>
