name: Publish Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    environment: prod
    strategy:
      matrix:
        os: [macos-latest, windows-2022]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup MSVC (Windows Native Compilation)
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1

      # Pin Python to 3.11 to fix node-gyp distutils error on Windows
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Set the PYTHON environment variable specifically for Windows
      - name: Configure Python for node-gyp (Windows)
        if: matrix.os == 'windows-2022'
        run: echo "PYTHON=${{ env.pythonLocation }}\python.exe" >> $env:GITHUB_ENV

      # Install dependencies with scripts ignored on Windows only
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-2022'
        run: npm ci --ignore-scripts

      # Install dependencies normally on macOS so host tools like appdmg build their native parts
      - name: Install dependencies (macOS)
        if: matrix.os != 'windows-2022'
        run: npm ci

      # Ensure electron-winstaller has its 7-Zip binaries available on Windows
      - name: Fix electron-winstaller 7-Zip binaries (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $vendorDir = "node_modules/electron-winstaller/vendor"
          if (Test-Path $vendorDir) {
            $sevenZipPath = "C:\Program Files\7-Zip"
            if (!(Test-Path "$vendorDir/7z.exe")) {
              if (Test-Path "$sevenZipPath/7z.exe") {
                Copy-Item "$sevenZipPath/7z.exe" "$vendorDir/"
                Copy-Item "$sevenZipPath/7z.dll" "$vendorDir/"
                Write-Host "Successfully copied 7-Zip binaries to vendor folder."
              }
            }
          }

      # Rebuild native modules for Electron
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      # Apple signing/notarization credentials (macOS only; OPTIONAL).
      # When MACOS_CERTIFICATE secret is absent (no paid Apple Developer ID),
      # this step is skipped and forge.config.js falls back to ad-hoc signing.
      # Users must approve the app via System Settings > Privacy & Security > Open Anyway
      # (or `xattr -cr /Applications/<App>.app`) on first launch.
      - name: Import code-signing certificates (macOS, optional)
        if: matrix.os != 'windows-2022' && secrets.MACOS_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      # Build/package application
      - name: Build/package application
        run: npm run make
        env:
          # Empty when secrets are absent -> forge.config.js falls back to ad-hoc signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Move Windows artifacts from C:\tmp\make to out/make so artifact upload matches macOS
      - name: Normalize Windows Artifact Path
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          if (Test-Path "C:\tmp\make") {
            New-Item -ItemType Directory -Force -Path "out/make"
            Copy-Item -Recurse -Force "C:\tmp\make\*" "out/make/"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: out/make

  release:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Get tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        continue-on-error: true
        shell: bash
        run: |
          git tag ${{ steps.get_tag.outputs.tag_name }}
          git push origin ${{ steps.get_tag.outputs.tag_name }}

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          files: |
            dist/dist-macos-latest/**/*.zip
            dist/dist-macos-latest/**/*.dmg
            dist/dist-windows-2022/**/*.exe
            dist/dist-windows-2022/**/*.nupkg
            dist/dist-windows-2022/**/RELEASES
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_GITHUB_PAT }}
