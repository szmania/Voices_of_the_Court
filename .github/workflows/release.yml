name: Publish Electron App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup MSVC (Windows Native Compilation)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # Pin Python to 3.11 to fix node-gyp distutils error on Windows
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NEW: Force npm to use the exact Python 3.11 path on Windows
      - name: Configure npm Python path (Windows)
        if: matrix.os == 'windows-latest'
        run: npm config set python "${{ env.pythonLocation }}\python.exe"

      - name: Install dependencies
        run: npm ci

      - name: Build/package application
        run: npm run make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: out/make

  release:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Get tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        continue-on-error: true
        shell: bash
        run: |
          git tag ${{ steps.get_tag.outputs.tag_name }}
          git push origin ${{ steps.get_tag.outputs.tag_name }}

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2 # Bumped to v2 to avoid Node 16 deprecation warnings
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          files: |
            dist/dist-macos-latest/**/*.zip
            dist/dist-macos-latest/**/*.dmg
            dist/dist-windows-latest/**/*.exe
            dist/dist-windows-latest/**/*.nupkg
            dist/dist-windows-latest/**/RELEASES
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_GITHUB_PAT }}
